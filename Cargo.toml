[workspace]
resolver = "2"
members = ["crates/ww-core", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Mikke Schirén"]
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
log = "0.4"

# Dictionary loading and suggestions are slow unoptimised; keep dev builds snappy.
[profile.dev.package.spellbook]
opt-level = 3
