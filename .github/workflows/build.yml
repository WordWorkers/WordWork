name: Build
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev libdbus-1-dev patchelf file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Pandoc sidecar (pinned 3.9, checksum-verified)
        run: scripts/fetch-pandoc.sh ${{ matrix.target }}

      - name: Licence notices (all bundled components, see "Om Word Work")
        run: |
          cargo install --locked cargo-about --features cli
          scripts/third-party-notices.sh

      - name: Apple signing (only if the secrets exist)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              # Multi-line safe; the values stay masked in the log.
              { echo "$v<<__EOF__"; printf '%s\n' "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Signing with Developer ID and notarizing."
          else
            echo "No Apple secrets – ad-hoc signing (users confirm once under Privacy & Security)."
          fi

      - name: Build
        # The Tauri CLI comes from frontend/package-lock.json (exact version, checksummed).
        run: frontend/node_modules/.bin/tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) cp "$bundle"/dmg/*.dmg "dist/Word-Work_${version}_macOS-AppleSilicon.dmg" ;;
            x86_64-apple-darwin)  cp "$bundle"/dmg/*.dmg "dist/Word-Work_${version}_macOS-Intel.dmg" ;;
            x86_64-pc-windows-msvc)
              cp "$bundle"/nsis/*-setup.exe "dist/Word-Work_${version}_Windows-x64-setup.exe"
              cp "$bundle"/msi/*.msi "dist/Word-Work_${version}_Windows-x64.msi" ;;
            x86_64-unknown-linux-gnu)
              cp "$bundle"/deb/*.deb "dist/word-work_${version}_amd64.deb"
              cp "$bundle"/rpm/*.rpm "dist/word-work-${version}.x86_64.rpm"
              cp "$bundle"/appimage/*.AppImage "dist/Word-Work_${version}_x86_64.AppImage" ;;
          esac
          ls -lh dist

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
          for bin in "$app"/Contents/MacOS/*; do echo "$(basename "$bin"): $(lipo -archs "$bin")"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-work-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: sed "s#REPO_URL#${{ github.server_url }}/${{ github.repository }}#g" docs/RELEASE_NOTES.md > notes.md
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: Word Work ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
